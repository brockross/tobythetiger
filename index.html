<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:ital,wght@0,300;0,400;0,500;1,300;1,400;1,500&display=swap"
      rel="stylesheet"
    />

    <title>toby the tiger</title>
    <style>
      html,
      body {
        font-family: "DM Mono", monospace;
        margin: 0;
        padding: 0;
        background-color: #fefbea;
        color: #3c4142;
        overflow: hidden;
        height: 100vh;
        width: 100vw;
      }

      #banner {
        background-color: #f55027;
        color: #fefbea;
        width: 100%;
        font-size: 36px;
        font-weight: 500;
        font-style: italic;
        padding: 0 0 0 8px;
        height: 41px;
      }

      #tagline {
        font-style: italic;
        font-size: 10px;
      }

      #main-container {
        padding: 8px;
      }

      h3,
      h4 {
        text-align: center;
      }

      .important-text {
        color: #f55027;
      }

      #cards-container {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .link-card {
        border: 1px solid #3c414244;
        width: 90%;
        min-height: 30px;
        margin-top: 10px;
        padding: 8px;
        display: flex;
        align-items: center;
        max-width: 390px;
        text-decoration: none;
      }

      #press-kit-card {
        padding-top: 12px;
        align-items: flex-start;
      }

      #press-kit-summary {
        cursor: pointer;
      }

      #press-kit-summary:hover {
        color: #f55027;
        font-weight: 500;
      }

      hr {
        width: 66%;
      }

      a {
        color: #3c4142;
      }

      a:hover {
        color: #f55027;
        font-weight: 500;
      }

      ul {
        margin-block-start: 0;
        margin-block-end: 0;
      }
    </style>
  </head>
  <body>
    <div>
      <div id="banner">toby the tiger</div>
      <div id="main-container">
        <marquee id="tagline" scrollamount="6"
          >thoughtful indie rock // Boise, ID</marquee
        >
        <h3>
          DEBUT ALBUM "DEMAPPER" STREAMING NOW!
          <div>
            <a
              class="important-text"
              href="https://open.spotify.com/album/0cuGaQAz9B0NABxGxP1uzI?si=c4asIDsORwKvUQ_Q0mP-wg"
              >SPOTIFY</a
            >
            *
            <a
              class="important-text"
              href="https://tobythetiger.bandcamp.com/album/demapper"
              >BANDCAMP</a
            >
            *
            <a
              class="important-text"
              href="https://music.apple.com/us/album/demapper/1772478589"
              >APPLE</a
            >
            *
            <a
              class="important-text"
              href="https://music.youtube.com/playlist?list=OLAK5uy_n6l0M5cAAGDGmpEAZk5WbcJMxNnVadafE&si=KTQ3vsgjUuloQqws"
              >YT</a
            >
          </div>
        </h3>
        <hr />
        <div id="cards-container">
          <a href="https://tobythetiger.bandcamp.com/" class="link-card"
            >bandcamp</a
          >
          <a
            href="https://www.instagram.com/toby__the__tiger/"
            class="link-card"
            >instagram</a
          >
          <a
            href="https://bsky.app/profile/broxel.bsky.social"
            class="link-card"
          >
            bluesky</a
          >
          <div
            href="https://tobythetiger.bandcamp.com/album/demapper"
            class="link-card"
            id="press-kit-card"
          >
            <details>
              <summary id="press-kit-summary">press kit</summary>
              <ul>
                <li>
                  <a
                    href="https://www.youtube.com/live/L8Ekd-QOk3M?si=kxv5Cd_p6UNVWHyP&t=1784"
                    target="_blank"
                    >Live at the Hive (concert footage)</a
                  >
                </li>
                <li>
                  <a
                    href="https://rosyoverdrive.com/2024/10/10/pressing-concerns-toby-the-tiger-the-submissives-jamison-field-murphy-osummer-vacation/"
                    target="_blank"
                    >Demapper album review</a
                  >
                </li>
                <li>
                  <a
                    href="https://rosyoverdrive.com/2024/12/10/rosy-overdrives-top-100-albums-of-2024-25-1/"
                    target="_blank"
                    >Demapper ranked #10 album of 2024</a
                  >
                </li>
              </ul>
            </details>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
